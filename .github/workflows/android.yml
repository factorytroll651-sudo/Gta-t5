              private void moveStick(float x, float y) {
                  float dx = x - stickCx;
                  float dy = y - stickCy;
                  float dist = (float) Math.hypot(dx, dy);
                  if (dist > stickR) {
                      dx = dx / dist * stickR;
                      dy = dy / dist * stickR;
                  }
                  thumbX = stickCx + dx;
                  thumbY = stickCy + dy;
                  float t = 0.38f * stickR;
                  setStick(0, dy < -t);
                  setStick(1, dx < -t);
                  setStick(2, dy > t);
                  setStick(3, dx > t);
                  invalidate();
              }

              private void setStick(int i, boolean down) {
                  if (stickDown[i] != down) {
                      stickDown[i] = down;
                      listener.onKey(stickKeys[i], down);
                  }
              }

              private void resetStick() {
                  thumbX = stickCx;
                  thumbY = stickCy;
                  for (int i = 0; i < 4; i++) {
                      setStick(i, false);
                  }
              }

              private void release(int id) {
                  if (id == stickPointer) {
                      stickPointer = -1;
                      resetStick();
                  }
                  for (Btn b : buttons) {
                      if (b.pointerId == id) {
                          b.pointerId = -1;
                          listener.onKey(b.keyCode, false);
                      }
                  }
                  invalidate();
              }

              private void releaseAll() {
                  stickPointer = -1;
                  resetStick();
                  for (Btn b : buttons) {
                      if (b.pointerId != -1) {
                          b.pointerId = -1;
                          listener.onKey(b.keyCode, false);
                      }
                  }
                  invalidate();
              }

              private void setHidden(boolean h) {
                  hidden = h;
                  if (h) {
                      releaseAll();
                  }
                  invalidate();
              }

              @Override
              protected void onDetachedFromWindow() {
                  releaseAll();
                  super.onDetachedFromWindow();
              }
          }

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="$(find . -maxdepth 1 -type f -iname 'gtavbysiwoo.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "GTAVBYSIwoo.zip repo ke root mein nahi mili. Repo ki files:"
            ls -la
            exit 1
          fi
          echo "Using $ZIP"
          unzip -o "$ZIP"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GTAVBYSiwoo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GTAVBYSiwoo-apk
          path: GTAVBYSiwoo.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: siwoo-build-${{ github.run_number }}
          name: GTA V Cloud by Siwoo build ${{ github.run_number }}
          files: GTAVBYSiwoo.apk

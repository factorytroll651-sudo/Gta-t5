name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/fiveplay/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FivePlay"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fiveplay.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.fiveplay.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="FivePlay"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fiveplay/app/ControlOverlay.java <<'EOF'
          package com.fiveplay.app;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.view.MotionEvent;
          import android.view.View;

          import java.util.ArrayList;
          import java.util.List;

          public class ControlOverlay extends View {

              public interface KeyListener {
                  void onKey(int keyCode, boolean down);
              }

              private static final class Btn {
                  final String label;
                  final int keyCode;
                  float cx, cy, r;
                  int pointerId = -1;

                  Btn(String label, int keyCode) {
                      this.label = label;
                      this.keyCode = keyCode;
                  }

                  boolean hit(float x, float y) {
                      float dx = x - cx, dy = y - cy, rr = r * 1.25f;
                      return dx * dx + dy * dy <= rr * rr;
                  }
              }

              // Diamond layout: bottom, right, left, top
              private static final float[] OFF_X = {0f, 1f, -1f, 0f};
              private static final float[] OFF_Y = {1f, 0f, 0f, -1f};

              private final KeyListener listener;
              private final int[] stickKeys; // up, left, down, right
              private final boolean[] stickDown = new boolean[4];
              private final List<Btn> buttons = new ArrayList<>();
              private final float density;
              private final Paint fillPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint strokePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);

              private float stickCx, stickCy, stickR, thumbX, thumbY;
              private int stickPointer = -1;
              private float toggleCx, toggleCy, toggleR;
              private boolean hidden = false;

              public ControlOverlay(Context ctx, KeyListener listener, int[] stickKeys,
                                    String[] labels, int[] keys) {
                  super(ctx);
                  if (listener == null) {
                      throw new IllegalArgumentException("listener is null");
                  }
                  if (stickKeys == null || stickKeys.length != 4) {
                      throw new IllegalArgumentException("stickKeys needs 4 keys: up, left, down, right");
                  }
                  if (labels == null || keys == null || labels.length != keys.length || labels.length > 4) {
                      throw new IllegalArgumentException("labels/keys must match and hold at most 4 entries");
                  }
                  this.listener = listener;
                  this.stickKeys = stickKeys.clone();
                  this.density = ctx.getResources().getDisplayMetrics().density;
                  for (int i = 0; i < labels.length; i++) {
                      buttons.add(new Btn(labels[i], keys[i]));
                  }
                  fillPaint.setStyle(Paint.Style.FILL);
                  strokePaint.setStyle(Paint.Style.STROKE);
                  strokePaint.setStrokeWidth(2f * density);
                  textPaint.setTextAlign(Paint.Align.CENTER);
                  textPaint.setTextSize(20f * density);
                  textPaint.setFakeBoldText(true);
                  setFocusable(false);
              }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  float d = density;
                  stickR = 62f * d;
                  stickCx = 36f * d + stickR;
                  stickCy = h - 28f * d - stickR;
                  thumbX = stickCx;
                  thumbY = stickCy;

                  float br = 30f * d;
                  float spacing = 40f * d;
                  float clusterCx = w - 36f * d - spacing - br;
                  float clusterCy = h - 28f * d - spacing - br;
                  for (int i = 0; i < buttons.size(); i++) {
                      Btn b = buttons.get(i);
                      b.r = br;
                      b.cx = clusterCx + OFF_X[i] * spacing;
                      b.cy = clusterCy + OFF_Y[i] * spacing;
                  }

                  toggleR = 16f * d;
                  toggleCx = w - 28f * d;
                  toggleCy = 28f * d;
              }

              @Override
              protected void onDraw(Canvas c) {
                  if (!hidden) {
                      fillPaint.setColor(0x33FFFFFF);
                      c.drawCircle(stickCx, stickCy, stickR, fillPaint);
                      strokePaint.setColor(0x99FFFFFF);
                      c.drawCircle(stickCx, stickCy, stickR, strokePaint);
                      fillPaint.setColor(0x88FFFFFF);
                      c.drawCircle(thumbX, thumbY, stickR * 0.42f, fillPaint);

                      for (Btn b : buttons) {
                          boolean on = b.pointerId != -1;
                          fillPaint.setColor(on ? 0xAAFFFFFF : 0x33FFFFFF);
                          c.drawCircle(b.cx, b.cy, b.r, fillPaint);
                          strokePaint.setColor(0x99FFFFFF);
                          c.drawCircle(b.cx, b.cy, b.r, strokePaint);
                          textPaint.setColor(on ? 0xFF000000 : 0xDDFFFFFF);
                          drawCentered(c, b.label, b.cx, b.cy);
                      }
                  }
                  fillPaint.setColor(0x44FFFFFF);
                  c.drawCircle(toggleCx, toggleCy, toggleR, fillPaint);
                  textPaint.setColor(0xDDFFFFFF);
                  drawCentered(c, hidden ? "+" : "-", toggleCx, toggleCy);
              }

              private void drawCentered(Canvas c, String t, float x, float y) {
                  Paint.FontMetrics fm = textPaint.getFontMetrics();
                  c.drawText(t, x, y - (fm.ascent + fm.descent) / 2f, textPaint);
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  int action = e.getActionMasked();
                  int idx = e.getActionIndex();
                  switch (action) {
                      case MotionEvent.ACTION_DOWN:
                      case MotionEvent.ACTION_POINTER_DOWN: {
                          float x = e.getX(idx);
                          float y = e.getY(idx);
                          int id = e.getPointerId(idx);

                          float tx = x - toggleCx, ty = y - toggleCy, tr = toggleR * 1.6f;
                          if (tx * tx + ty * ty <= tr * tr) {
                              setHidden(!hidden);
                              return true;
                          }
                          if (hidden) {
                              return false;
                          }
                          float sx = x - stickCx, sy = y - stickCy, sr = stickR * 1.35f;
                          if (stickPointer == -1 && sx * sx + sy * sy <= sr * sr) {
                              stickPointer = id;
                              moveStick(x, y);
                              return true;
                          }
                          for (Btn b : buttons) {
                              if (b.pointerId == -1 && b.hit(x, y)) {
                                  b.pointerId = id;
                                  listener.onKey(b.keyCode, true);
                                  invalidate();
                                  return true;
                              }
                          }
                          return false; // not ours: let the game below receive this touch
                      }
                      case MotionEvent.ACTION_MOVE:
                          for (int i = 0; i < e.getPointerCount(); i++) {
                              if (e.getPointerId(i) == stickPointer) {
                                  moveStick(e.getX(i), e.getY(i));
                              }
                          }
                          return true;
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_POINTER_UP:
                          release(e.getPointerId(idx));
                          return true;
                      case MotionEvent.ACTION_CANCEL:
                          releaseAll();
                          return true;
                      default:
                          return false;
                  }
              }

              private void moveStick(float x, float y) {
                  float dx = x - stickCx;
                  float dy = y - stickCy;
                  float dist = (float) Math.hypot(dx, dy);
                  if (dist > stickR) {
                      dx = dx / dist * stickR;
                      dy = dy / dist * stickR;
                  }
                  thumbX = stickCx + dx;
                  thumbY = stickCy + dy;
                  float t = 0.38f * stickR;
                  setStick(0, dy < -t);
                  setStick(1, dx < -t);
                  setStick(2, dy > t);
                  setStick(3, dx > t);
                  invalidate();
              }

              private void setStick(int i, boolean down) {
                  if (stickDown[i] != down) {
                      stickDown[i] = down;
                      listener.onKey(stickKeys[i], down);
                  }
              }

              private void resetStick() {
                  thumbX = stickCx;
                  thumbY = stickCy;
                  for (int i = 0; i < 4; i++) {
                      setStick(i, false);
                  }
              }

              private void release(int id) {
                  if (id == stickPointer) {
                      stickPointer = -1;
                      resetStick();
                  }
                  for (Btn b : buttons) {
                      if (b.pointerId == id) {
                          b.pointerId = -1;
                          listener.onKey(b.keyCode, false);
                      }
                  }
                  invalidate();
              }

              private void releaseAll() {
                  stickPointer = -1;
                  resetStick();
                  for (Btn b : buttons) {
                      if (b.pointerId != -1) {
                          b.pointerId = -1;
                          listener.onKey(b.keyCode, false);
                      }
                  }
                  invalidate();
              }

              private void setHidden(boolean h) {
                  hidden = h;
                  if (h) {
                      releaseAll();
                  }
                  invalidate();
              }

              @Override
              protected void onDetachedFromWindow() {
                  releaseAll();
                  super.onDetachedFromWindow();
              }
          }
          EOF

          cat > app/src/main/java/com/fiveplay/app/MainActivity.java <<'EOF'
          package com.fiveplay.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.util.Log;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.ConsoleMessage;
          import android.webkit.CookieManager;
          import android.webkit.RenderProcessGoneDetail;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import java.util.Locale;

          public class MainActivity extends Activity {

              private static final String TAG = "FivePlay";

              // ---------- CONFIG ----------
              private static final String START_URL = "https://fiveplay.lol/";
              // Main-page navigation outside these hosts is blocked (ad redirects). Add hosts if needed.
              private static final String[] ALLOWED_HOSTS = {"fiveplay.lol"};
              private static final boolean CONTROLS_ENABLED = true;
              // false = native key events (works inside iframes). true = JS KeyboardEvent dispatch.
              // If buttons do nothing in the game, flip this.
              private static final boolean USE_JS_KEYS = false;
              // Joystick: up, left, down, right
              private static final int[] STICK_KEYS = {
                      KeyEvent.KEYCODE_W, KeyEvent.KEYCODE_A, KeyEvent.KEYCODE_S, KeyEvent.KEYCODE_D};
              // Buttons (max 4): bottom, right, left, top
              private static final String[] BTN_LABELS = {"A", "B", "X", "Y"};
              private static final int[] BTN_KEYS = {
                      KeyEvent.KEYCODE_SPACE, KeyEvent.KEYCODE_SHIFT_LEFT,
                      KeyEvent.KEYCODE_E, KeyEvent.KEYCODE_Q};
              // ----------------------------

              private static final String ERROR_HTML =
                      "<html><body style='background:#000;color:#fff;font-family:sans-serif;"
                              + "display:flex;flex-direction:column;align-items:center;"
                              + "justify-content:center;height:100vh;margin:0'>"
                              + "<h2>No connection</h2>"
                              + "<button style='font-size:20px;padding:12px 28px' "
                              + "onclick=\"location.href='" + START_URL + "'\">Retry</button>"
                              + "</body></html>";

              private FrameLayout root;
              private WebView webView;
              private ControlOverlay overlay;
              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;
              private long lastBackPress = 0L;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  enterImmersive();

                  ViewGroup.LayoutParams match = new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);

                  root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF000000);
                  root.setMotionEventSplittingEnabled(true);

                  webView = new WebView(this);
                  configureWebView(webView);
                  root.addView(webView, match);

                  if (CONTROLS_ENABLED) {
                      overlay = new ControlOverlay(this, this::sendKey, STICK_KEYS, BTN_LABELS, BTN_KEYS);
                      root.addView(overlay, match);
                  }
                  setContentView(root);

                  if (state == null || webView.restoreState(state) == null) {
                      webView.loadUrl(START_URL);
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void configureWebView(WebView w) {
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setJavaScriptCanOpenWindowsAutomatically(false);
                  s.setSupportMultipleWindows(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setAllowFileAccess(false);
                  // Some sites refuse WebView clients ("; wv" in the user agent): present as plain Chrome.
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));

                  w.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  w.setBackgroundColor(0xFF000000);
                  w.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  w.setLongClickable(false);
                  w.setOnLongClickListener(v -> true);
                  w.setHapticFeedbackEnabled(false);
                  w.setFocusable(true);
                  w.setFocusableInTouchMode(true);

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(w, true);

                  w.setWebViewClient(new Client());
                  w.setWebChromeClient(chromeClient);
              }

              private final WebChromeClient chromeClient = new WebChromeClient() {
                  @Override
                  public void onShowCustomView(View view, CustomViewCallback cb) {
                      if (customView != null) {
                          cb.onCustomViewHidden();
                          return;
                      }
                      customView = view;
                      customCallback = cb;
                      root.addView(view, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                      if (overlay != null) {
                          overlay.bringToFront();
                      }
                  }

                  @Override
                  public void onHideCustomView() {
                      if (customView == null) {
                          return;
                      }
                      root.removeView(customView);
                      customView = null;
                      if (customCallback != null) {
                          customCallback.onCustomViewHidden();
                          customCallback = null;
                      }
                  }

                  @Override
                  public boolean onConsoleMessage(ConsoleMessage m) {
                      Log.d(TAG, "console: " + m.message() + " (" + m.sourceId() + ":" + m.lineNumber() + ")");
                      return true;
                  }
              };

              private final class Client extends WebViewClient {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                      if (!r.isForMainFrame()) {
                          return false;
                      }
                      Uri u = r.getUrl();
                      String scheme = u.getScheme();
                      if (!"http".equals(scheme) && !"https".equals(scheme)) {
                          Log.w(TAG, "Blocked non-web scheme: " + u);
                          return true;
                      }
                      if (isAllowedHost(u.getHost())) {
                          return false;
                      }
                      Log.w(TAG, "Blocked redirect: " + u);
                      Toast.makeText(MainActivity.this, "Blocked redirect", Toast.LENGTH_SHORT).show();
                      return true;
                  }

                  @Override
                  public void onPageFinished(WebView v, String url) {
                      v.requestFocus();
                  }

                  @Override
                  public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError err) {
                      if (r.isForMainFrame()) {
                          Log.e(TAG, "Load error " + err.getErrorCode() + ": " + err.getDescription());
                          v.loadDataWithBaseURL(null, ERROR_HTML, "text/html", "UTF-8", null);
                      }
                  }

                  @Override
                  public boolean onRenderProcessGone(WebView v, RenderProcessGoneDetail d) {
                      Log.e(TAG, "Renderer gone, crashed=" + d.didCrash() + ". Restarting.");
                      Intent again = getIntent();
                      if (root != null) {
                          root.removeView(v);
                      }
                      v.destroy();
                      webView = null;
                      finish();
                      startActivity(again);
                      return true;
                  }
              }

              private static boolean isAllowedHost(String host) {
                  if (host == null) {
                      return false;
                  }
                  String h = host.toLowerCase(Locale.ROOT);
                  for (String a : ALLOWED_HOSTS) {
                      if (h.equals(a) || h.endsWith("." + a)) {
                          return true;
                      }
                  }
                  return false;
              }

              // ---------- key injection ----------

              private void sendKey(int keyCode, boolean down) {
                  WebView w = webView;
                  if (w == null) {
                      return;
                  }
                  try {
                      if (down && !w.hasFocus()) {
                          w.requestFocus();
                      }
                      if (USE_JS_KEYS) {
                          sendJsKey(w, keyCode, down);
                      } else {
                          long now = SystemClock.uptimeMillis();
                          w.dispatchKeyEvent(new KeyEvent(now, now,
                                  down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, keyCode, 0));
                      }
                  } catch (RuntimeException ex) {
                      Log.e(TAG, "sendKey failed for keyCode " + keyCode, ex);
                  }
              }

              private void sendJsKey(WebView w, int keyCode, boolean down) {
                  String[] info = jsInfo(keyCode);
                  if (info == null) {
                      Log.w(TAG, "No JS mapping for keyCode " + keyCode);
                      return;
                  }
                  String type = down ? "keydown" : "keyup";
                  String js = "(function(){"
                          + "var k=" + q(info[0]) + ",c=" + q(info[1]) + ",kc=" + info[2] + ";"
                          + "var t=document.activeElement;"
                          + "if(!t||t===document.body){t=document.querySelector('canvas')||document;}"
                          + "var e=new KeyboardEvent('" + type + "',"
                          + "{key:k,code:c,keyCode:kc,which:kc,bubbles:true,cancelable:true});"
                          + "try{Object.defineProperty(e,'keyCode',{get:function(){return kc;}});"
                          + "Object.defineProperty(e,'which',{get:function(){return kc;}});}catch(x){}"
                          + "t.dispatchEvent(e);})();";
                  w.evaluateJavascript(js, null);
              }

              private static String q(String s) {
                  return "'" + s.replace("\\", "\\\\").replace("'", "\\'") + "'";
              }

              /** Returns {key, code, jsKeyCode} or null if unmapped. */
              private static String[] jsInfo(int k) {
                  if (k >= KeyEvent.KEYCODE_A && k <= KeyEvent.KEYCODE_Z) {
                      int off = k - KeyEvent.KEYCODE_A;
                      char c = (char) ('a' + off);
                      return new String[]{String.valueOf(c), "Key" + Character.toUpperCase(c),
                              String.valueOf(65 + off)};
                  }
                  if (k >= KeyEvent.KEYCODE_0 && k <= KeyEvent.KEYCODE_9) {
                      int off = k - KeyEvent.KEYCODE_0;
                      return new String[]{String.valueOf(off), "Digit" + off, String.valueOf(48 + off)};
                  }
                  switch (k) {
                      case KeyEvent.KEYCODE_SPACE:
                          return new String[]{" ", "Space", "32"};
                      case KeyEvent.KEYCODE_ENTER:
                          return new String[]{"Enter", "Enter", "13"};
                      case KeyEvent.KEYCODE_ESCAPE:
                          return new String[]{"Escape", "Escape", "27"};
                      case KeyEvent.KEYCODE_TAB:
                          return new String[]{"Tab", "Tab", "9"};
                      case KeyEvent.KEYCODE_SHIFT_LEFT:
                          return new String[]{"Shift", "ShiftLeft", "16"};
                      case KeyEvent.KEYCODE_CTRL_LEFT:
                          return new String[]{"Control", "ControlLeft", "17"};
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                          return new String[]{"ArrowLeft", "ArrowLeft", "37"};
                      case KeyEvent.KEYCODE_DPAD_UP:
                          return new String[]{"ArrowUp", "ArrowUp", "38"};
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                          return new String[]{"ArrowRight", "ArrowRight", "39"};
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          return new String[]{"ArrowDown", "ArrowDown", "40"};
                      default:
                          return null;
                  }
              }

              // ---------- lifecycle ----------

              @SuppressWarnings("deprecation")
              private void enterImmersive() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      enterImmersive();
                  }
              }

              @SuppressWarnings("deprecation")
              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      chromeClient.onHideCustomView();
                      return;
                  }
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastBackPress < 2000L) {
                      super.onBackPressed();
                  } else {
                      lastBackPress = now;
                      Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (webView != null) {
                      webView.saveState(out);
                  }
              }

              @Override
              protected void onPause() {
                  if (webView != null) {
                      webView.onPause();
                  }
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.onResume();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      root.removeView(webView);
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FivePlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FivePlay-apk
          path: FivePlay.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FivePlay build ${{ github.run_number }}
          files: FivePlay.apk
